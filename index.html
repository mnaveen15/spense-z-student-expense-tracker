<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spense-Z | Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">STUDENT EXPENSE TRACKER</p>
        <h1>Spense-Z</h1>
        <p class="tagline">Spend. Sense. Better.</p>
      </div>
      <div class="badge">JavaScript Mini Project</div>
    </header>

    <section class="summary">
      <div class="card total">
        <span>Total Spending</span>
        <strong id="totalAmount">₹0</strong>
      </div>
      <div class="card">
        <span>Transactions</span>
        <strong id="transactionCount">0</strong>
      </div>
      <div class="card">
        <span>Average Spend</span>
        <strong id="averageAmount">₹0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <div class="grid">
          <label>
            Expense Name
            <input id="expenseName" type="text" placeholder="e.g. Lunch" required>
          </label>
          <label>
            Amount (₹)
            <input id="expenseAmount" type="number" min="1" step="0.01" placeholder="e.g. 120" required>
          </label>
          <label>
            Category
            <select id="expenseCategory">
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Education</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </label>
        </div>
        <button type="submit">+ Add Expense</button>
        <p id="message" class="message"></p>
      </form>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>Expense History</h2>
          <p id="filterInfo">Showing all expenses</p>
        </div>
        <select id="filterCategory" aria-label="Filter by category">
          <option value="All">All Categories</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Education</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>

      <div id="expenseList" class="expense-list"></div>
      <div id="emptyState" class="empty">No expenses added yet.</div>
    </section>

    <section class="panel analytics">
      <h2>Quick Analytics</h2>
      <div id="analyticsText"></div>
      <button id="affordableBtn" class="secondary">Show Expenses Under ₹200</button>
      <button id="resetBtn" class="danger">Clear All</button>
    </section>

    <footer>Spense-Z • Built with HTML, CSS & JavaScript</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
